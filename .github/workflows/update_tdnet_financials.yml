name: Update TDnet Financial Metrics

on:
  workflow_dispatch:
  schedule:
    # 平日18:20 JST。決算短信のXBRL公開後に前回取得分を更新する。
    - cron: '20 9 * * 1-5'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r scripts/requirements.txt
      - name: Extract latest TDnet XBRL metrics
        run: python scripts/update_tdnet_financial_metrics.py
      - name: Commit data when changed
        run: |
          if git diff --quiet frontend/public/data/financial_metrics.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add frontend/public/data/financial_metrics.json
          git commit -m "chore: update TDnet financial metrics"
          git pull --rebase origin main
          git push
