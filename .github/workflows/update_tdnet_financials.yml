name: Update TDnet Financial Metrics

on:
  workflow_dispatch:
  schedule:
    # 決算集中期（1・4・7・10月）は平日18:20 JST。
    - cron: '20 9 * 1,4,7,10 1-5'
    # それ以外は火・金18:20 JST。最新XBRLを保ちつつ不要な全銘柄走査を減らす。
    - cron: '20 9 * 2,3,5,6,8,9,11,12 2,5'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r scripts/requirements.txt
      - name: Extract latest TDnet XBRL metrics
        run: python scripts/update_tdnet_financial_metrics.py
      - name: Commit data when changed
        run: |
          if git diff --quiet frontend/public/data/financial_metrics.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add frontend/public/data/financial_metrics.json
          git commit -m "chore: update TDnet financial metrics"
          git pull --rebase origin main
          git push
