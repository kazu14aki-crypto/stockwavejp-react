name: Update TDnet Financial Metrics

on:
  workflow_dispatch:
    inputs:
      codes:
        description: '検証・限定更新用の4桁銘柄コード（空白区切り、空なら全銘柄）'
        required: false
        default: ''
      limit:
        description: '検証用の最大件数（空なら制限なし）'
        required: false
        default: ''
  schedule:
    # 決算集中期（1・4・7・10月）は平日18:20 JST。
    - cron: '20 9 * 1,4,7,10 1-5'
    # それ以外は火・金18:20 JST。最新XBRLを保ちつつ不要な全銘柄走査を減らす。
    - cron: '20 9 * 2,3,5,6,8,9,11,12 2,5'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # tdnet 0.3系は Python 3.12 以上が必須。3.11では依存関係の解決前に停止する。
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r scripts/requirements.txt
      - name: Extract latest TDnet XBRL metrics
        env:
          CODES: ${{ github.event.inputs.codes || '' }}
          LIMIT: ${{ github.event.inputs.limit || '' }}
        run: |
          args=()
          if [ -n "$CODES" ]; then read -ra code_list <<< "$CODES"; args+=(--codes "${code_list[@]}"); fi
          if [ -n "$LIMIT" ]; then args+=(--limit "$LIMIT"); fi
          python scripts/update_tdnet_financial_metrics.py "${args[@]}"
          python scripts/merge_financial_metrics_into_market.py
      - name: Commit data when changed
        run: |
          if git diff --quiet frontend/public/data/financial_metrics.json frontend/public/data/market.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add frontend/public/data/financial_metrics.json frontend/public/data/market.json
          git commit -m "chore: update TDnet financial metrics"
          git pull --rebase origin main
          git push
